version: '3'
services:
    mongo:
        image: mongo:7.0
        container_name: mongo
        restart: always
        environment:
            - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
            - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
        ports:
            - 27017:27017
        volumes:
            - ./mongo-data:/data/db
        command: --wiredTigerCacheSizeGB 1.5
