version: '3.8'

services:
    mongo:
        image: mongo:6.0.5
        container_name: mongo
        restart: unless-stopped
        environment:
            MONGO_INITDB_ROOT_USERNAME: admin
            MONGO_INITDB_ROOT_PASSWORD: admin
        ports:
            - '27017:27017'
        volumes:
            - mongo_data:/data/db
        healthcheck:
            test: mongosh --eval "db.adminCommand('ping')" --quiet
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - app-network

    api:
        container_name: top-api
        build: .
        ports:
            - '3001:3000'
        environment:
            - PORT=3000
            - MONGO_HOST=mongo
            - MONGO_PORT=27017
            - MONGO_LOGIN=admin
            - MONGO_PASSWORD=admin
            - MONGO_AUTHDATABASE=admin
            - MONGO_AUTHSOURCE=admin
        depends_on:
            mongo:
                condition: service_healthy
        networks:
            - app-network

volumes:
    mongo_data:

networks:
    app-network:
        driver: bridge
